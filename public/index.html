<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080a0f" />
  <meta name="description" content="Интерактивная карта и народная фотолетопись регионов и городов России" />
  <title>KYR — Знай свою Россию</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KYR">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/styles.css" />
<body>
  <header id="topbar">
    <div class="brand">
      <div class="brand-crest" aria-hidden="true">
        <!-- Engraved graticule mark: neutral linework, single accent point -->
        <svg class="crest-svg" viewBox="0 0 26 26" fill="none" stroke="#e7e2d6">
          <circle cx="13" cy="13" r="10.25" stroke-opacity="0.55" stroke-width="1"/>
          <ellipse cx="13" cy="13" rx="4.4" ry="10.25" stroke-opacity="0.28" stroke-width="0.85"/>
          <path d="M3.4 9.4h19.2M3.4 16.6h19.2M2.75 13h20.5" stroke-opacity="0.28" stroke-width="0.85"/>
          <circle cx="16.1" cy="9.4" r="1.5" fill="#b0392f" stroke="none"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">KYR</span>
        <span class="brand-sub">Знай свою Россию</span>
      </div>
    </div>

    <!-- Level switcher -->
    <div class="view-switch" role="tablist">
      <button id="lvl-adm1" class="switch-btn active" data-lvl="1" title="Субъекты Российской Федерации">
        <span class="dot"></span> Субъекты
      </button>
      <button id="lvl-adm2" class="switch-btn" data-lvl="2" title="Муниципальные районы и городские округа">
        <span class="dot"></span> Районы
      </button>
      <button id="lvl-points" class="switch-btn" data-lvl="points" title="Отдельные точки съёмки">
        <span class="dot"></span> Точки съёмки
      </button>
    </div>

    <!-- Omni-search: regions, cities, coordinates -->
    <div class="omni-search" id="omni-search">
      <form id="search-form" class="search-form" autocomplete="off">
        <span class="search-icon" aria-hidden="true">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="Регион, город или координаты" spellcheck="false" autocomplete="off" />
        <button type="button" id="search-clear" class="search-clear hidden" title="Очистить">&times;</button>
        <button type="submit" id="search-submit" class="search-submit" title="Найти" aria-label="Найти">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </form>
      <div id="search-suggestions" class="search-suggestions hidden"></div>
    </div>

    <div id="hint" class="hint-pill"></div>
    <nav id="nav"><!-- filled by app.js --></nav>
  </header>

  <div id="map-wrap">
    <div id="map"></div>

    <!-- Choropleth legend; ranges match styleArea() classes in app.js -->
    <div class="map-legend" id="map-legend">
      <div class="legend-title">Материалов в регионе</div>
      <div class="legend-scale">
        <div class="legend-step"><span class="legend-color c-0"></span><span class="legend-label">0</span></div>
        <div class="legend-step"><span class="legend-color c-1"></span><span class="legend-label">1–2</span></div>
        <div class="legend-step"><span class="legend-color c-2"></span><span class="legend-label">3–9</span></div>
        <div class="legend-step"><span class="legend-color c-3"></span><span class="legend-label">10–29</span></div>
        <div class="legend-step"><span class="legend-color c-4"></span><span class="legend-label">30+</span></div>
      </div>
    </div>
  </div>

  <!-- Mobile bottom navigation bar -->
  <nav id="mobile-bar" class="mobile-bar" aria-label="Мобильная навигация">
    <button type="button" class="mob-btn active" id="mob-nav-map" title="Карта">
      <svg class="mob-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>Карта</span>
    </button>
    <button type="button" class="mob-btn" id="mob-nav-search" title="Поиск">
      <svg class="mob-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Поиск</span>
    </button>
    <button type="button" class="mob-btn mob-btn-upload" id="mob-nav-upload" title="Загрузить">
      <div class="mob-upload-plus">
        <svg class="mob-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span>Добавить</span>
    </button>
    <button type="button" class="mob-btn" id="mob-nav-user" title="Профиль">
      <svg class="mob-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="mob-user-label">Вход</span>
    </button>
    <button type="button" class="mob-btn" id="mob-nav-app" title="Приложение">
      <svg class="mob-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      <span>Приложение</span>
    </button>
  </nav>

  <!-- Modal shell reused for every dialog -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" data-close title="Закрыть">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/app.js"></script>
</body>
</html>
