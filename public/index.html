<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KYR — Знай свою Россию</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <div class="flag-strip">
        <span class="f-white"></span>
        <span class="f-blue"></span>
        <span class="f-red"></span>
      </div>
      <div class="brand-text">
        <span class="brand-title">KYR</span>
        <span class="brand-sub">Знай свою Россию</span>
      </div>
    </div>

    <!-- Mode / Level switcher -->
    <div class="view-switch">
      <button id="lvl-adm1" class="switch-btn active" data-lvl="1">
        <span class="dot"></span> Области
      </button>
      <button id="lvl-adm2" class="switch-btn" data-lvl="2">
        <span class="dot"></span> Районы и города
      </button>
      <button id="lvl-points" class="switch-btn" data-lvl="points">
        <span class="dot"></span> Точки
      </button>
    </div>

    <div class="spacer"></div>
    <div id="hint" class="hint"></div>
    <nav id="nav"><!-- filled by app.js --></nav>
  </header>

  <div id="map-wrap">
    <div id="map"></div>

    <!-- Floating Info Card on Hover -->
    <div id="area-card" class="area-card hidden">
      <div class="ac-header">
        <span class="ac-badge" id="ac-type">Регион</span>
        <span class="ac-count" id="ac-total">0 материалов</span>
      </div>
      <h3 class="ac-title" id="ac-name">—</h3>
      <div class="ac-stats">
        <div class="stat-pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.6A1.6 1.6 0 0 1 4.6 7h2L7.8 5.2A1 1 0 0 1 8.6 4.8h6.8a1 1 0 0 1 .8.4L17.4 7h2A1.6 1.6 0 0 1 21 8.6v9A1.6 1.6 0 0 1 19.4 19H4.6A1.6 1.6 0 0 1 3 17.6z"/><circle cx="12" cy="12.6" r="3.1"/></svg> <span id="ac-photos">0</span> фото</div>
        <div class="stat-pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="12" rx="2.2"/><path d="M15 10.4 21 7v10l-6-3.4z"/></svg> <span id="ac-videos">0</span> видео</div>
      </div>
      <button id="ac-gallery-btn" class="ac-btn">Открыть галерею <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
    </div>

    <!-- Mode Helper / Legend -->
    <div class="map-legend">
      <span class="legend-chip"><span class="legend-color c-low"></span> Мало</span>
      <span class="legend-chip"><span class="legend-color c-med"></span> Средне</span>
      <span class="legend-chip"><span class="legend-color c-high"></span> Много</span>
    </div>
  </div>

  <!-- Modal shell reused for every dialog -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" data-close>&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/app.js"></script>
</body>
</html>
