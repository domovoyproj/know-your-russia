<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>АТЛАС РОССИИ — Умная фотогалерея регионов</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <div class="brand-crest" aria-hidden="true">
        <svg class="crest-svg" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="rgba(217, 164, 65, 0.45)" stroke-width="1.2"/>
          <circle cx="16" cy="16" r="10.5" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
          <polygon points="16,3 18.5,13.5 16,16 13.5,13.5" fill="#e01e2b"/>
          <polygon points="16,29 18.5,18.5 16,16 13.5,18.5" fill="#a8131d"/>
          <polygon points="3,16 13.5,13.5 16,16 13.5,18.5" fill="#d9a441"/>
          <polygon points="29,16 18.5,13.5 16,16 18.5,18.5" fill="#b38229"/>
          <circle cx="16" cy="16" r="2.2" fill="#ffffff"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">АТЛАС РОССИИ</span>
        <span class="brand-sub">Умная фотогалерея 89 субъектов</span>
      </div>
    </div>

    <!-- Mode / Level switcher -->
    <div class="view-switch" role="tablist">
      <button id="lvl-adm1" class="switch-btn active" data-lvl="1" title="Субъекты Российской Федерации">
        <span class="dot"></span> Регионы РФ
      </button>
      <button id="lvl-adm2" class="switch-btn" data-lvl="2" title="Муниципальные районы и округа">
        <span class="dot"></span> Районы
      </button>
      <button id="lvl-points" class="switch-btn" data-lvl="points" title="Индивидуальные фото- и видеоточки">
        <span class="dot"></span> Точки съёмки
      </button>
    </div>

    <!-- Smart Omni-Search Bar: Regions, Cities, Coordinates -->
    <div class="omni-search" id="omni-search">
      <form id="search-form" class="search-form" autocomplete="off">
        <span class="search-icon" aria-hidden="true">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="Поиск региона, города или координат..." spellcheck="false" autocomplete="off" />
        <button type="button" id="search-clear" class="search-clear hidden" title="Очистить">&times;</button>
        <button type="submit" id="search-submit" class="search-submit" title="Найти">Найти</button>
      </form>
      <div id="search-suggestions" class="search-suggestions hidden"></div>
    </div>


    <div id="hint" class="hint-pill"></div>
    <nav id="nav"><!-- filled by app.js --></nav>
  </header>

  <div id="map-wrap">
    <div id="map"></div>


    <!-- Mode Helper / Legend -->
    <div class="map-legend">
      <span class="legend-chip"><span class="legend-color c-low"></span> Мало</span>
      <span class="legend-chip"><span class="legend-color c-med"></span> Средне</span>
      <span class="legend-chip"><span class="legend-color c-high"></span> Много</span>
    </div>
  </div>

  <!-- Modal shell reused for every dialog -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" data-close>&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/app.js"></script>
</body>
</html>
