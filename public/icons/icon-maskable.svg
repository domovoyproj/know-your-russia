
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="0" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Globe / Graticule Sphere -->
  <g transform="translate(256, 216)">
    <!-- Outer sphere ring -->
    <circle r="130" fill="#0c101a" stroke="rgba(148, 163, 184, 0.45)" stroke-width="3"/>
    
    <!-- Parallels -->
    <path d="M-121,-46 C-50,-26 50,-26 121,-46" fill="none" stroke="rgba(148, 163, 184, 0.28)" stroke-width="2.5"/>
    <path d="M-130,0 C-60,30 60,30 130,0" fill="none" stroke="rgba(148, 163, 184, 0.35)" stroke-width="3"/>
    <path d="M-121,46 C-50,70 50,70 121,46" fill="none" stroke="rgba(148, 163, 184, 0.28)" stroke-width="2.5"/>

    <!-- Meridians -->
    <line x1="0" y1="-130" x2="0" y2="130" stroke="rgba(148, 163, 184, 0.35)" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="58" ry="130" fill="none" stroke="rgba(148, 163, 184, 0.32)" stroke-width="2.5"/>

    <!-- Glow at pin location -->
    <circle cx="34" cy="-44" r="32" fill="url(#pinGlow)"/>

    <!-- Active Pin point -->
    <circle cx="34" cy="-44" r="10" fill="#60a5fa"/>
    <circle cx="34" cy="-44" r="6" fill="#ffffff"/>
    <circle cx="34" cy="-44" r="15" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="2 3"/>
  </g>

  <!-- Typography -->
  <text x="256" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="12" fill="url(#textGrad)" text-anchor="middle">KYR</text>
  <text x="256" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#64748b" text-anchor="middle">ЗНАЙ СВОЮ РОССИЮ</text>
</svg>
